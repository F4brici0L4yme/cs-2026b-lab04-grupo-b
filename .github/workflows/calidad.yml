name: Calidad Lab 12
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest==8.3.5 pytest-cov==6.0.0 ruff==0.11.2 bandit==1.8.3 radon==6.0.1
      - run: python calidad/verificar.py hu-12
